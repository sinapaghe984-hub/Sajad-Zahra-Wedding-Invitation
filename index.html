<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوت‌نامه عروسی | محمد سجاد و زهرا</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'B Nazanin','Tahoma','Arial',sans-serif}

body{
  background:linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #8b0000 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  margin:0;
  padding:0;
  position:relative;
  overflow:hidden;
}

/* قلب‌های متحرک */
.heart {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-size: 30px;
  opacity: 0.7;
}

/* قلب‌های پشت عکس */
.invitation-heart {
  position: absolute;
  pointer-events: none;
  font-size: 25px;
  opacity: 0.6;
}

.container{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.envelope{
  position:relative;
  width:340px;
  height:220px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 30px 80px rgba(0,0,0,0.4);
  cursor:pointer;
  transform-style:preserve-3d;
  transition:all 0.6s ease;
  margin:0 auto;
  border:2px solid #ffb6c1;
}

.envelope:hover {
  transform: translateY(-5px);
  box-shadow: 0 40px 100px rgba(255, 107, 157, 0.5);
}

.envelope.opened{
  animation:openEnvelope 1s ease forwards;
}

@keyframes openEnvelope{
  0%{transform:rotateX(0deg) scale(1);}
  50%{transform:rotateX(-20deg) scale(1.02);}
  100%{transform:rotateX(-180deg);opacity:0;pointer-events:none;}
}

.envelope-front{
  position:absolute;
  width:100%;
  height:100%;
  background:#fff;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
  border:2px solid #ffb6c1;
  overflow:hidden;
  box-shadow:inset 0 2px 10px rgba(255, 107, 157, 0.2);
}

.envelope-front::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:50%;
  background:linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  z-index:5;
  box-shadow: 0 5px 15px rgba(196, 69, 105, 0.3);
}

/* دکوراسیون گلدار */
.envelope-front::after{
  content:'🌹';
  position:absolute;
  font-size:30px;
  top:10px;
  right:15px;
  opacity:0.7;
  animation:float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.envelope-decoration {
  position: absolute;
  font-size: 20px;
  opacity: 0.5;
  animation: float 4s ease-in-out infinite;
}

.envelope-decoration:nth-child(1) { top: 10px; left: 15px; animation-delay: 0s; }
.envelope-decoration:nth-child(2) { bottom: 10px; right: 15px; animation-delay: 1s; }

.envelope-text{
  position:relative;
  z-index:6;
  text-align:center;
  color:#fff;
  text-shadow:3px 3px 8px rgba(0,0,0,0.3);
}

.envelope-text h2{
  margin:0;
  font-size:28px;
  font-weight:bold;
  letter-spacing:1px;
}

.envelope-text p{
  margin:8px 0 0 0;
  font-size:15px;
  opacity:0.95;
  font-weight:500;
}

.envelope-icon{
  position:absolute;
  bottom:25px;
  font-size:50px;
  animation:bounce 2s infinite;
  z-index:6;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,0.2));
}

@keyframes bounce{
  0%, 100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-15px) scale(1.1);}
}

.invitation{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.6s ease;
  backdrop-filter:blur(5px);
}

.invitation.show{
  opacity:1;
  pointer-events:all;
}

.invitation-content{
  position:relative;
  width:90%;
  max-width:600px;
  max-height:90vh;
  background:#fff;
  border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,0.5);
  overflow:hidden;
  animation:slideUp 0.8s ease;
  border:3px solid #ffb6c1;
}

@keyframes slideUp{
  from{transform:translateY(100px) scale(0.9);opacity:0;}
  to{transform:translateY(0) scale(1);opacity:1;}
}

.invitation img{
  width:100%;
  height:auto;
  display:block;
  border-radius:18px;
  position:relative;
  z-index:5;
}

.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  background:linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
  border:none;
  width:45px;
  height:45px;
  border-radius:50%;
  font-size:28px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s ease;
  z-index:10;
  color:#fff;
  box-shadow:0 5px 15px rgba(196, 69, 105, 0.4);
}

.close-btn:hover{
  transform:scale(1.15) rotate(90deg);
  box-shadow:0 8px 20px rgba(196, 69, 105, 0.6);
}

/* نشانگر "کلیک کنید" */
.hint-text {
  position: absolute;
  bottom: -50px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.8);
  font-size: 14px;
  animation: pulse 2s infinite;
  z-index: 5;
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

@media (max-width:768px){
  .envelope{width:290px;height:190px;}
  .envelope-text h2{font-size:20px;}
  .envelope-text p{font-size:13px;}
  .envelope-icon{font-size:35px;bottom:20px;}
  .invitation-content{width:95%;max-height:95vh;}
  .close-btn{width:40px;height:40px;font-size:24px;}
}

@media (max-width:480px){
  .envelope{width:250px;height:160px;}
  .envelope-text h2{font-size:18px;}
  .envelope-text p{font-size:11px;}
  .envelope-icon{font-size:30px;}
  .close-btn{width:35px;height:35px;font-size:20px;}
  .hint-text {font-size:12px;}
}
</style>
</head>
<body>
  <div class="container">
    <div class="envelope" id="envelope">
      <div class="envelope-front">
        <div class="envelope-decoration">💐</div>
        <div class="envelope-decoration">💐</div>
        <div class="envelope-text">
          <h2>🎊 دعوتنامه عروسی</h2>
          <p>محمد سجاد و زهرا</p>
        </div>
        <div class="envelope-icon">💌</div>
      </div>
      <div class="hint-text">👆 اینجا کلیک کنید</div>
    </div>
  </div>

  <div class="invitation" id="invitation">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="invitation-content" id="invitationContent">
      <img src="https://github.com/Mamad73x2x/Sajad-zahra/raw/main/file_0000000060f08210b4ca0169d9e337b8.png" alt="دعوت‌نامه عروسی">
    </div>
  </div>

  <audio id="weddingMusic" loop>
    <source src="https://dl.mehrdl.top/Music/A/D/LeilaFroohar/Leila%20Forouhar%20-%20Aroosi.mp3" type="audio/mpeg">
  </audio>

  <script>
    const envelope = document.getElementById('envelope');
    const invitation = document.getElementById('invitation');
    const invitationContent = document.getElementById('invitationContent');
    const closeBtn = document.getElementById('closeBtn');
    const weddingMusic = document.getElementById('weddingMusic');
    let isPlaying = false;
    let heartsInterval = null;
    let invitationHeartsInterval = null;

    weddingMusic.volume = 0.5;

    // ایجاد قلب‌های متحرک (صفحه اصلی)
    function createHearts() {
      const heartCount = 30;
      const hearts = ['💕', '💗', '❤️', '💖'];

      for (let i = 0; i < heartCount; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        
        const startX = Math.random() * window.innerWidth;
        heart.style.left = startX + 'px';
        heart.style.bottom = '-50px';
        
        document.body.appendChild(heart);

        // انیمیشن بالا رفتن
        let bottom = -50;
        const speed = Math.random() * 2 + 1;
        const sway = Math.random() * 2 - 1;
        const duration = Math.random() * 3000 + 2000;
        let currentX = startX;

        const startTime = Date.now();
        const rise = setInterval(() => {
          const elapsed = Date.now() - startTime;
          
          bottom += speed;
          currentX += sway * 0.5;
          
          heart.style.bottom = bottom + 'px';
          heart.style.left = currentX + 'px';
          
          // تغییر opacity هنگام بالا رفتن
          const opacity = 1 - (elapsed / duration);
          heart.style.opacity = Math.max(0, opacity);

          if (elapsed > duration || bottom > window.innerHeight) {
            clearInterval(rise);
            heart.remove();
          }
        }, 20);
      }
    }

    // ایجاد قلب‌های پشت عکس
    function createInvitationHearts() {
      const heartCount = 8;
      const hearts = ['💕', '💗', '❤️', '💖'];

      for (let i = 0; i < heartCount; i++) {
        const heart = document.createElement('div');
        heart.className = 'invitation-heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        
        const randomX = Math.random() * 100;
        const randomY = Math.random() * 100;
        heart.style.left = randomX + '%';
        heart.style.top = randomY + '%';
        heart.style.animation = `float ${3 + Math.random() * 2}s ease-in-out infinite`;
        heart.style.animationDelay = Math.random() * 2 + 's';
        
        invitationContent.appendChild(heart);
      }
    }

    // شروع قلب‌های مستمر هنگام نمایش عکس
    function startContinuousHearts() {
      if (heartsInterval) return;
      
      createHearts(); // قلب‌های اولیه
      heartsInterval = setInterval(createHearts, 1500); // هر 1.5 ثانیه
    }

    // متوقف کردن قلب‌های مستمر
    function stopContinuousHearts() {
      if (heartsInterval) {
        clearInterval(heartsInterval);
        heartsInterval = null;
      }
    }

    // باز کردن پاکت
    envelope.addEventListener('click', function() {
      this.classList.add('opened');
      createHearts(); // قلب‌های اولیه
      
      setTimeout(() => {
        invitation.classList.add('show');
        startContinuousHearts(); // شروع قلب‌های مستمر
        createInvitationHearts(); // اضافه کردن قلب‌های پشت عکس
        
        // پخش موسیقی خودکار
        weddingMusic.play().catch(err => {
          console.log('خطا:', err);
        });
        isPlaying = true;
      }, 300);
    });

    // بستن دعوت‌نامه
    closeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      invitation.classList.remove('show');
      stopContinuousHearts(); // متوقف کردن قلب‌های مستمر
      
      // حذف قلب‌های پشت عکس
      const invitationHearts = invitationContent.querySelectorAll('.invitation-heart');
      invitationHearts.forEach(heart => heart.remove());
      
      setTimeout(() => {
        envelope.classList.remove('opened');
        weddingMusic.pause();
        weddingMusic.currentTime = 0;
        isPlaying = false;
      }, 600);
    });

    // بستن با کلیک روی background
    invitation.addEventListener('click', function(e) {
      if(e.target === this) closeBtn.click();
    });
  </script>
</body>
</html>
