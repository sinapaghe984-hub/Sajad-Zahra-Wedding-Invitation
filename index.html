<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تجلی عشق✨ | محمد سجاد 💫 زهرا</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'B Nazanin','Tahoma','Arial',sans-serif}

body{
  background:linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #8b0000 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  margin:0;
  padding:0;
  position:relative;
  overflow:hidden;
}

.container{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.envelope{
  position:relative;
  width:340px;
  height:220px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 30px 80px rgba(0,0,0,0.4);
  cursor:pointer;
  transform-style:preserve-3d;
  transition:all 0.6s ease;
  margin:0 auto;
  border:2px solid #ffb6c1;
}

.envelope:hover {
  transform: translateY(-5px);
  box-shadow: 0 40px 100px rgba(255, 107, 157, 0.5);
}

.envelope.opened{
  animation:openEnvelope 1s ease forwards;
}

@keyframes openEnvelope{
  0%{transform:rotateX(0deg) scale(1);}
  50%{transform:rotateX(-20deg) scale(1.02);}
  100%{transform:rotateX(-180deg);opacity:0;pointer-events:none;}
}

.envelope-front{
  position:absolute;
  width:100%;
  height:100%;
  background:#fff;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
  border:2px solid #ffb6c1;
  overflow:hidden;
  box-shadow:inset 0 2px 10px rgba(255, 107, 157, 0.2);
}

.envelope-front::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:50%;
  background:linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  z-index:5;
  box-shadow: 0 5px 15px rgba(196, 69, 105, 0.3);
}

.envelope-front::after{
  content:'🌹';
  position:absolute;
  font-size:30px;
  top:10px;
  right:15px;
  opacity:0.7;
  animation:float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.envelope-decoration {
  position: absolute;
  font-size: 20px;
  opacity: 0.5;
  animation: float 4s ease-in-out infinite;
}

.envelope-decoration:nth-child(1) { top: 10px; left: 15px; animation-delay: 0s; }
.envelope-decoration:nth-child(2) { bottom: 10px; right: 15px; animation-delay: 1s; }

.envelope-text{
  position:relative;
  z-index:6;
  text-align:center;
  color:#800020;
  text-shadow:3px 3px 8px rgba(0,0,0,0.3);
}

.envelope-text h2{
  margin:0;
  font-size:28px;
  font-weight:bold;
  letter-spacing:1px;
}

.envelope-text p{
  margin:8px 0 0 0;
  font-size:15px;
  opacity:0.95;
  font-weight:500;
}

.envelope-icon{
  position:absolute;
  bottom:25px;
  font-size:50px;
  animation:bounce 2s infinite;
  z-index:6;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,0.2));
}

@keyframes bounce{
  0%, 100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-15px) scale(1.1);}
}

.invitation{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.6s ease;
  backdrop-filter:blur(5px);
}

.invitation.show{
  opacity:1;
  pointer-events:all;
}

.invitation-content{
  position:relative;
  width:90%;
  max-width:600px;
  max-height:90vh;
  background:#fff;
  border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,0.5);
  overflow:visible;
  animation:slideUp 0.8s ease;
  border:3px solid #ffb6c1;
}

@keyframes slideUp{
  from{transform:translateY(100px) scale(0.9);opacity:0;}
  to{transform:translateY(0) scale(1);opacity:1;}
}

.invitation img{
  width:100%;
  height:auto;
  display:block;
  border-radius:18px;
  position:relative;
  z-index:5;
}

/* قلب‌های ظریف و دوطرفه */
.falling-heart{
  position:fixed;
  pointer-events:none;
  font-size:24px;
  opacity:.38;
  z-index:1200;
  will-change:transform,opacity;
  user-select:none;
}
@keyframes heartDown{
  0%{transform:translate3d(0,-40px,0) rotate(-10deg) scale(.75);opacity:0}
  10%{opacity:.38}
  100%{transform:translate3d(var(--drift),calc(100vh + 80px),0) rotate(25deg) scale(1);opacity:0}
}
@keyframes heartUp{
  0%{transform:translate3d(0,40px,0) rotate(10deg) scale(.75);opacity:0}
  10%{opacity:.38}
  100%{transform:translate3d(var(--drift),calc(-100vh - 80px),0) rotate(-25deg) scale(1);opacity:0}
}
.falling-heart.down{animation:heartDown 4.8s linear forwards}
.falling-heart.up{animation:heartUp 4.8s linear forwards}

/* فشفشه */
.firework-particle{
  position:fixed;
  left:0;
  top:0;
  pointer-events:none;
  font-size:20px;
  opacity:1;
  z-index:1300;
  will-change:transform,opacity;
  user-select:none;
}
@keyframes explode{
  0%{transform:translate3d(0,0,0) scale(.65);opacity:1}
  65%{opacity:1}
  100%{transform:translate3d(var(--tx),var(--ty),0) scale(.05);opacity:0}
}
.firework-particle.animate{animation:explode 1.35s ease-out forwards}

/* منو لوکیشن */
.location-menu{
  position:absolute;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  border-radius:15px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  overflow:hidden;
  z-index:20;
  min-width:180px;
  opacity:0;
  pointer-events:none;
  transition:all 0.3s ease;
}

.location-menu.show{
  opacity:1;
  pointer-events:all;
  animation:slideUpMenu 0.3s ease forwards;
}

@keyframes slideUpMenu{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(10px);
  }
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
}

.location-menu a{
  display:block;
  width:100%;
  padding:15px 20px;
  text-align:right;
  text-decoration:none;
  cursor:pointer;
  font-size:15px;
  font-family:'B Nazanin','Tahoma','Arial',sans-serif;
  font-weight:bold;
  color:#333;
  transition:all 0.2s ease;
  border-bottom:1px solid #eee;
}

.location-menu a:last-child{
  border-bottom:none;
}

.location-menu a:hover{
  background:#f5f5f5;
  padding-right:30px;
}

/* دکمه لوکیشن کوچیک */
.location-btn{
  position:absolute;
  /* نوشته «مکان» داخل تصویر، پایینِ سمت راست */
  right:16.8%;
  bottom:5.2%;
  left:auto;
  transform:none;
  background:linear-gradient(90deg,
    #ff4d6d 0%,
    #ff9f1c 20%,
    #ffe66d 35%,
    #2ec4b6 55%,
    #4d96ff 72%,
    #9b5de5 88%,
    #ff4d6d 100%);
  background-size:300% 100%;
  animation:locationRainbow 4s linear infinite;
  border:none;
  color:#fff;
  padding:0px 3px;
  border-radius:8px;
  cursor:pointer;
  font-size:6px;
  font-weight:bold;
  transition:all 0.3s ease;
  box-shadow:0 5px 15px rgba(196, 69, 105, 0.4);
  z-index:15;
  font-family:'B Nazanin','Tahoma','Arial',sans-serif;
}

@keyframes locationRainbow{
  0%{background-position:0% 50%;}
  100%{background-position:100% 50%;}
}

.location-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(196, 69, 105, 0.6);
}

.location-btn:active{
  transform:translateY(-1px);
}

.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  background:linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
  border:none;
  width:45px;
  height:45px;
  border-radius:50%;
  font-size:28px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s ease;
  z-index:25;
  color:#fff;
  box-shadow:0 5px 15px rgba(196, 69, 105, 0.4);
}

.close-btn:hover{
  transform:scale(1.15) rotate(90deg);
  box-shadow:0 8px 20px rgba(196, 69, 105, 0.6);
}

.hint-text {
  position: absolute;
  bottom: -50px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.8);
  font-size: 14px;
  animation: pulse 2s infinite;
  z-index: 5;
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

@media (max-width:768px){
  .envelope{width:290px;height:190px;}
  .envelope-text h2{font-size:20px;}
  .envelope-text p{font-size:13px;}
  .envelope-icon{font-size:35px;bottom:20px;}
  .invitation-content{width:95%;max-height:95vh;}
  .close-btn{width:40px;height:40px;font-size:24px;}
  .location-btn{padding:5px 10px;font-size:10px;}
}

@media (max-width:480px){
  .envelope{width:250px;height:160px;}
  .envelope-text h2{font-size:18px;}
  .envelope-text p{font-size:11px;}
  .envelope-icon{font-size:30px;}
  .close-btn{width:35px;height:35px;font-size:20px;}
  .hint-text {font-size:12px;}
  .location-btn{padding:5px 9px;font-size:10px;}
}
</style>
</head>
<body>
  <div class="container">
    <div class="envelope" id="envelope">
      <div class="envelope-front">
        <div class="envelope-decoration">💐</div>
        <div class="envelope-decoration">💐</div>
        <div class="envelope-text">
          <h2>✨ تجلی عشق✨</h2>
          <p>محمد سجاد ❤️‍🔥 زهرا</p>
        </div>
        <div class="envelope-icon">💌</div>
      </div>
      <div class="hint-text">👆 اینجا کلیک کنید</div>
    </div>
  </div>

  <div class="invitation" id="invitation">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="invitation-content" id="invitationContent">
      <img src="https://raw.githubusercontent.com/sinapaghe984-hub/Sajad-Zahra-Wedding-Invitation/main/file_000000003c94820aad0d009238442cba.png" alt="دعوت‌نامه عروسی">
      
      <!-- منو لوکیشن -->
      <div class="location-menu" id="locationMenu">
        <a id="neshan-link" target="_blank" href="https://neshan.org/maps/places/7bZmwmQxwCaM">🗺️ نشان</a>
        <a id="google-link" target="_blank" href="https://maps.app.goo.gl/8dzN2KYJNfc1ViNf7">🗺️ گوگل مپ</a>
        <a id="balad-link" target="_blank" href="https://balad.ir/location?latitude=32.707982&longitude=51.732369&zoom=16.500000">🗺️ بلد</a>
      </div>
      
      <!-- دکمه لوکیشن -->
      <button class="location-btn" id="locationBtn">📍 مکان</button>
    </div>
  </div>

  <audio id="weddingMusic" loop>
    <source src="https://dl.mehrdl.top/Music/A/D/LeilaFroohar/Leila%20Forouhar%20-%20Aroosi.mp3" type="audio/mpeg">
  </audio>

  <script>
    const envelope = document.getElementById('envelope');
    const invitation = document.getElementById('invitation');
    const invitationContent = document.getElementById('invitationContent');
    const closeBtn = document.getElementById('closeBtn');
    const weddingMusic = document.getElementById('weddingMusic');
    const locationBtn = document.getElementById('locationBtn');
    const locationMenu = document.getElementById('locationMenu');

    // لینک‌های نقشه‌ها با مختصات دقیق
    const googleMapsLink = 'https://maps.app.goo.gl/8dzN2KYJNfc1ViNf7';
    const lat = '32.707895';
    const lng = '51.732378';
    const neshanLink = `https://neshan.org/maps/places/7bZmwmQxwCaM`;
    const baladLink = `https://balad.ir/location?latitude=32.707982&longitude=51.732369&zoom=16.500000`;

    weddingMusic.volume = 0.5;

    // تنظیم لینک‌ها
    document.getElementById('neshan-link').href = neshanLink;
    document.getElementById('balad-link').href = baladLink;

    // ایجاد قلب‌های متحرک
    function createFallingHeart(direction) {
      const hearts = ['💕', '💗', '❤️', '💖', '💝'];
      const heart = document.createElement('div');

      heart.className = 'falling-heart ' + direction;
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left = (5 + Math.random() * 90) + 'vw';
      heart.style.top = direction === 'down'
        ? '-40px'
        : 'calc(100vh + 40px)';
      heart.style.setProperty('--drift', ((Math.random() - 0.5) * 120) + 'px');
      heart.style.fontSize = (18 + Math.random() * 10) + 'px';

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    function createFirework(x, y) {
      const symbols = ['✦', '✧', '✨', '⋆', '⭐'];
      const count = 42;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'firework-particle';
        particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.fontSize = (16 + Math.random() * 16) + 'px';

        const angle = (i / count) * Math.PI * 2;
        const distance = 120 + Math.random() * 170;

        particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');

        document.body.appendChild(particle);
        requestAnimationFrame(() => particle.classList.add('animate'));
        setTimeout(() => particle.remove(), 1500);
      }
    }

    let heartInterval = null;

    function startCelebration() {
      // ۱) اول فشفشه
      createFirework(window.innerWidth / 2, window.innerHeight * 0.42);

      // ۲) بعد قلب‌ها از بالا و پایین
      setTimeout(() => {
        createFallingHeart('down');
        createFallingHeart('up');

        heartInterval = setInterval(() => {
          createFallingHeart(Math.random() < 0.5 ? 'down' : 'up');
        }, 550);
      }, 1200);
    }

    function stopCelebration() {
      if (heartInterval) {
        clearInterval(heartInterval);
        heartInterval = null;
      }

      document.querySelectorAll('.falling-heart, .firework-particle')
        .forEach(el => el.remove());
    }

    // منو لوکیشن
    locationBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      locationMenu.classList.toggle('show');
    });

    // بسته شدن منو با کلیک بیرون
    document.addEventListener('click', function(e) {
      if (!locationMenu.contains(e.target) && e.target !== locationBtn) {
        locationMenu.classList.remove('show');
      }
    });

    // بسته شدن منو بعد از انتخاب
    document.querySelectorAll('.location-menu a').forEach(link => {
      link.addEventListener('click', function() {
        locationMenu.classList.remove('show');
      });
    });

    // باز کردن پاکت
    envelope.addEventListener('click', function() {
      this.classList.add('opened');
      
      setTimeout(() => {
        invitation.classList.add('show');
        startCelebration();
        
        weddingMusic.play().catch(err => {
          console.log('خطا:', err);
        });
      }, 300);
    });

    // بستن دعوتنامه
    closeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      invitation.classList.remove('show');
      stopCelebration();
      locationMenu.classList.remove('show');
      
      setTimeout(() => {
        envelope.classList.remove('opened');
        weddingMusic.pause();
        weddingMusic.currentTime = 0;
      }, 600);
    });

    // بستن با کلیک روی background
    invitation.addEventListener('click', function(e) {
      if(e.target === this) closeBtn.click();
    });
  </script>
</body>
</html>
